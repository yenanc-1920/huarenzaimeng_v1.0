spring:
  datasource:
    # Use a project-scoped variable so the hosting platform cannot pre-bind or
    # rewrite Spring Boot's conventional SPRING_DATASOURCE_URL property.
    url: ${HZ_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
  flyway:
    enabled: true
    url: ${HZ_DATASOURCE_URL}
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}
    locations: classpath:db/migration
    connect-retries: 0
    validate-on-migrate: true
    baseline-on-migrate: false
hz:
  # These are independent secret references. Release startup fails when either
  # is missing, weak, or resolves to the same value as the other.
  test-access-token: ${HZ_TEST_ACCESS_TOKEN}
  project-auth:
    content-token: ${HZ_CONTENT_ADMIN_TOKEN}
  p014:
    mode: disabled
    fixture-mode: no-default
  p021:
    # Enable only for the isolated huarenzaimeng_it_vnext integration deployment.
    mode: ${HZ_P021_MODE:disabled}
    fixture-mode: no-default
  temporal-overview:
    mode: disabled
  persistence:
    mode: mysql
