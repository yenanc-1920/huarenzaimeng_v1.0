spring:
  datasource:
    # Use a project-scoped variable so the hosting platform cannot pre-bind or
    # rewrite Spring Boot's conventional SPRING_DATASOURCE_URL property.
    url: ${HZ_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}
    locations: classpath:db/migration
    connect-retries: 0
    validate-on-migrate: true
    baseline-on-migrate: false
hz:
  persistence:
    mode: mysql
