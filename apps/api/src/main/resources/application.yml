spring:
  application:
    name: huarenzaimeng-api-mock
  profiles:
    default: mock
  main:
    banner-mode: "off"
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
hz-mock:
  external-network: DENY_ALL
  real-adapters-enabled: false
hz:
  persistence:
    mode: in-memory
  worker:
    task-leasing-status: NOT_IMPLEMENTED
