name: dev-predeploy-gate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/admin-web/package-lock.json
            apps/miniapp/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      - run: npm ci
        working-directory: apps/miniapp
      - name: Fast code and startup gate
        run: node tools/run-dev-fast-gate.mjs

  full-release-gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/admin-web/package-lock.json
            apps/miniapp/package-lock.json
      - run: npm ci
        working-directory: apps/admin-web
      - run: npm ci
        working-directory: apps/miniapp
      - name: Full deterministic release gate
        run: node tools/run-dev-deployment-gate.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build exact DEV image without repeating tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: false
          tags: huaren-api-dev:${{ github.sha }}
          cache-from: type=gha,scope=huaren-api-dev
          cache-to: type=gha,mode=max,scope=huaren-api-dev

  promote-deploy-branch:
    if: github.event_name == 'push'
    needs: full-release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance deployment branch only after the full gate
        run: git push origin HEAD:refs/heads/deploy/dev
