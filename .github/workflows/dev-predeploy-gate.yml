name: dev-predeploy-gate

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  exact-dev-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Fail fast on DEV startup wiring
        run: >-
          mvn -B -ntp -s .mvn/settings.xml -pl apps/api -am
          -Dtest=ReleaseSecretBoundaryValidatorTest,DevelopmentFlywayMigrationRunnerTest,BuildSelectionContractTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Build exact DEV image
        run: docker build --file Dockerfile.dev --tag huaren-api-dev:predeploy .
