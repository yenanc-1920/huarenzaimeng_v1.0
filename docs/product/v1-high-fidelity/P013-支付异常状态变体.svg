<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="844" viewBox="0 0 1170 844">
  <rect width="1170" height="844" fill="#E9EEF6"/>
  <g font-family="Arial,'Microsoft YaHei'">
    <g transform="translate(0 0)"><rect width="390" height="844" rx="32" fill="#F4F7FB"/><rect width="390" height="94" rx="32" fill="#FFF"/><rect y="62" width="390" height="32" fill="#FFF"/><text x="24" y="61" font-size="23" fill="#1B2B45">‹</text><text x="58" y="58" font-size="18" font-weight="700" fill="#142540">支付结果</text><circle cx="195" cy="168" r="48" fill="#F3F5F8"/><text x="195" y="179" text-anchor="middle" font-size="32" fill="#738096">×</text><text x="195" y="247" text-anchor="middle" font-size="25" font-weight="700" fill="#142540">支付已取消</text><text x="195" y="278" text-anchor="middle" font-size="14" fill="#69778D">未扣款，可以重新发起支付</text><rect x="20" y="310" width="350" height="142" rx="22" fill="#FFF"/><text x="40" y="344" font-size="12" fill="#7A8799">订单号 HZ202608160001</text><text x="40" y="382" font-size="14" fill="#68768C">当前状态</text><text x="348" y="382" text-anchor="end" font-size="14" font-weight="700" fill="#69778D">用户取消</text><text x="40" y="421" font-size="12" fill="#8090A4">订单仍保留 15 分钟，价格过期后需重新确认</text><rect x="20" y="706" width="350" height="58" rx="18" fill="#195BB8"/><text x="195" y="742" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">重新支付</text><text x="195" y="795" text-anchor="middle" font-size="11" fill="#8793A4">取消支付不会提交充值</text></g>
    <g transform="translate(390 0)"><rect width="390" height="844" rx="32" fill="#F4F7FB"/><rect width="390" height="94" rx="32" fill="#FFF"/><rect y="62" width="390" height="32" fill="#FFF"/><text x="24" y="61" font-size="23" fill="#1B2B45">‹</text><text x="58" y="58" font-size="18" font-weight="700" fill="#142540">支付结果</text><circle cx="195" cy="168" r="48" fill="#FFF8E8"/><text x="195" y="178" text-anchor="middle" font-size="30" fill="#B47A16">?</text><text x="195" y="247" text-anchor="middle" font-size="25" font-weight="700" fill="#142540">支付结果确认中</text><text x="195" y="278" text-anchor="middle" font-size="14" fill="#69778D">请勿重复支付，我们正在查询原交易</text><rect x="20" y="310" width="350" height="156" rx="22" fill="#FFF"/><text x="40" y="344" font-size="12" fill="#7A8799">订单号 HZ202608160001</text><text x="40" y="382" font-size="14" fill="#68768C">微信支付事实</text><text x="348" y="382" text-anchor="end" font-size="14" font-weight="700" fill="#B47A16">暂未确认</text><text x="40" y="421" font-size="12" fill="#8090A4">仅查询原订单，不会再次扣款或提交充值</text><rect x="20" y="706" width="350" height="58" rx="18" fill="#195BB8"/><text x="195" y="742" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">刷新结果</text><text x="195" y="795" text-anchor="middle" font-size="11" fill="#8793A4">长时间未确认可联系微信客服</text></g>
    <g transform="translate(780 0)"><rect width="390" height="844" rx="32" fill="#F4F7FB"/><rect width="390" height="94" rx="32" fill="#FFF"/><rect y="62" width="390" height="32" fill="#FFF"/><text x="24" y="61" font-size="23" fill="#1B2B45">‹</text><text x="58" y="58" font-size="18" font-weight="700" fill="#142540">支付结果</text><circle cx="195" cy="168" r="48" fill="#FDEEEE"/><text x="195" y="178" text-anchor="middle" font-size="30" fill="#C44E4E">!</text><text x="195" y="247" text-anchor="middle" font-size="25" font-weight="700" fill="#142540">支付失败</text><text x="195" y="278" text-anchor="middle" font-size="14" fill="#69778D">微信未完成扣款，本次充值未提交</text><rect x="20" y="310" width="350" height="156" rx="22" fill="#FFF"/><text x="40" y="344" font-size="12" fill="#7A8799">订单号 HZ202608160001</text><text x="40" y="382" font-size="14" fill="#68768C">失败原因</text><text x="348" y="382" text-anchor="end" font-size="14" font-weight="700" fill="#C44E4E">支付未完成</text><text x="40" y="421" font-size="12" fill="#8090A4">请检查微信支付状态后重试</text><rect x="20" y="706" width="350" height="58" rx="18" fill="#195BB8"/><text x="195" y="742" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">重新支付</text><text x="195" y="795" text-anchor="middle" font-size="11" fill="#8793A4">如已扣款请勿重试，先查询原订单</text></g>
  </g>
