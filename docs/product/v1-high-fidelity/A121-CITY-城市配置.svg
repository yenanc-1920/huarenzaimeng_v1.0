<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" rx="18" fill="#F3F6FA"/><rect width="228" height="820" fill="#10284D"/><g font-family="Arial,'Microsoft YaHei'"><text x="32" y="48" font-size="20" font-weight="700" fill="#FFF">华人在孟 · 运营台</text><text x="40" y="94" font-size="14" fill="#B9C8DE">工作台</text><text x="40" y="146" font-size="14" fill="#B9C8DE">内容审核</text><rect x="16" y="170" width="196" height="40" rx="12" fill="#195BB8"/><text x="40" y="198" font-size="14" fill="#FFF">黄页管理</text><rect x="228" width="972" height="74" fill="#FFF"/><text x="262" y="37" font-size="21" font-weight="700" fill="#142540">城市配置</text><text x="262" y="58" font-size="11" fill="#7A8799">城市与详细地址分字段；停用后不影响历史记录</text><rect x="252" y="98" width="924" height="76" rx="18" fill="#FFF"/><rect x="274" y="116" width="190" height="40" rx="12" fill="#F7F9FC" stroke="#E1E7EF"/><text x="290" y="141" font-size="12" fill="#7A8799">城市编码 / 名称</text><rect x="478" y="116" width="160" height="40" rx="12" fill="#F7F9FC" stroke="#E1E7EF"/><text x="494" y="141" font-size="12" fill="#7A8799">状态：全部</text><rect x="1032" y="116" width="122" height="40" rx="12" fill="#195BB8"/><text x="1093" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">新增城市</text><rect x="252" y="194" width="924" height="354" rx="18" fill="#FFF"/><text x="276" y="226" font-size="15" font-weight="700" fill="#142540">城市列表</text><rect x="272" y="246" width="884" height="42" rx="10" fill="#F4F7FB"/><text x="286" y="272" font-size="11" font-weight="700" fill="#68768C">城市编码</text><text x="416" y="272" font-size="11" font-weight="700" fill="#68768C">中文名</text><text x="546" y="272" font-size="11" font-weight="700" fill="#68768C">英文/当地名</text><text x="696" y="272" font-size="11" font-weight="700" fill="#68768C">排序</text><text x="816" y="272" font-size="11" font-weight="700" fill="#68768C">默认城市</text><text x="936" y="272" font-size="11" font-weight="700" fill="#68768C">状态</text><text x="1056" y="272" font-size="11" font-weight="700" fill="#68768C">操作</text><text x="286" y="322" font-size="11" fill="#263852">BD-DAC</text><text x="416" y="322" font-size="11" fill="#263852">达卡</text><text x="546" y="322" font-size="11" fill="#263852">Dhaka</text><text x="696" y="322" font-size="11" fill="#263852">1</text><text x="816" y="322" font-size="11" fill="#263852">是</text><text x="936" y="322" font-size="11" fill="#19865D">启用</text><text x="1056" y="322" font-size="11" fill="#195BB8">编辑</text><line x1="272" y1="344" x2="1156" y2="344" stroke="#EDF1F6"/><text x="286" y="388" font-size="11" fill="#263852">BD-CGP</text><text x="416" y="388" font-size="11" fill="#263852">吉大港</text><text x="546" y="388" font-size="11" fill="#263852">Chattogram</text><text x="696" y="388" font-size="11" fill="#263852">2</text><text x="816" y="388" font-size="11" fill="#263852">否</text><text x="936" y="388" font-size="11" fill="#19865D">启用</text><text x="1056" y="388" font-size="11" fill="#195BB8">编辑</text><rect x="252" y="568" width="924" height="154" rx="18" fill="#FFF"/><text x="276" y="604" font-size="16" font-weight="700" fill="#142540">编辑与发布规则</text><text x="276" y="638" font-size="12" fill="#263852">普通角色：内容运营提交 → 内容审核员审核 → 有权限人员发布</text><text x="276" y="668" font-size="12" fill="#263852">唯一超级管理员：允许同人完成三步，但必须分别记录操作、版本和时间</text><text x="276" y="698" font-size="11" fill="#7A8799">停用城市后禁止新增发布；历史黄页版本与订单事实不受影响</text></g></svg>
