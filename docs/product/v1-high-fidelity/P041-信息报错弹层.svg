<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" rx="32" fill="#F4F7FB"/><rect width="390" height="844" rx="32" fill="#142540" fill-opacity=".46"/>
  <rect x="20" y="166" width="350" height="512" rx="24" fill="#FFF"/><g font-family="Arial,'Microsoft YaHei'"><text x="44" y="210" font-size="20" font-weight="700" fill="#142540">报告信息有误</text><text x="346" y="210" text-anchor="end" font-size="24" fill="#68768C">×</text><text x="44" y="240" font-size="12" fill="#7A8799">选择固定原因，可补充说明；提交不会直接修改正文</text>
  <text x="44" y="280" font-size="13" font-weight="700" fill="#243650">问题原因</text><rect x="44" y="298" width="142" height="38" rx="19" fill="#EAF2FF" stroke="#195BB8"/><text x="115" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#195BB8">电话无法接通</text><rect x="198" y="298" width="142" height="38" rx="19" fill="#F4F7FB"/><text x="269" y="322" text-anchor="middle" font-size="12" fill="#596A82">地址有误</text><rect x="44" y="348" width="142" height="38" rx="19" fill="#F4F7FB"/><text x="115" y="372" text-anchor="middle" font-size="12" fill="#596A82">已停止营业</text><rect x="198" y="348" width="142" height="38" rx="19" fill="#F4F7FB"/><text x="269" y="372" text-anchor="middle" font-size="12" fill="#596A82">其他问题</text>
  <text x="44" y="426" font-size="13" font-weight="700" fill="#243650">补充说明（选填）</text><rect x="44" y="444" width="296" height="102" rx="16" fill="#F7F9FC" stroke="#DDE4EE"/><text x="60" y="470" font-size="12" fill="#9AA5B4">例如：多次拨打均提示号码不存在</text><text x="326" y="530" text-anchor="end" font-size="11" fill="#9AA5B4">0 / 200</text>
  <rect x="44" y="570" width="296" height="52" rx="16" fill="#195BB8"/><text x="192" y="602" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">提交报错</text><text x="192" y="648" text-anchor="middle" font-size="11" fill="#8793A4">提交成功后返回请求号，频繁提交会被限制</text></g>
</svg>
