<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="844" viewBox="0 0 1170 844">
  <rect width="1170" height="844" fill="#F4F7FB"/><g font-family="Arial,'Microsoft YaHei'"><text x="40" y="54" font-size="24" font-weight="700" fill="#142540">V1 前台关键状态变体标注</text><text x="40" y="80" font-size="12" fill="#75839A">不改变正常态页面结构；状态由稳定业务状态、中文展示键、requestId、retryable 与允许动作驱动</text>
  <g font-size="12" fill="#263852">
    <g transform="translate(40 110)"><rect width="342" height="208" rx="22" fill="#FFF"/><text x="20" y="34" font-size="16" font-weight="700" fill="#195BB8">交易前 P001 / P010 / P011 / P012</text><text x="20" y="68">P001：加载骨架；时间局部失败（充值入口仍可用）</text><text x="20" y="94">P010：号码为空；识别失败；已识别但暂无可售渠道</text><text x="20" y="120">P011：目录加载；无商品；价格已过期；当前不可售</text><text x="20" y="146">P012：报价过期；价格漂移；未登录；创建订单失败</text><rect x="20" y="166" width="114" height="26" rx="13" fill="#FFF3D8"/><text x="77" y="184" text-anchor="middle" fill="#9B6815">未知不等于失败</text></g>
    <g transform="translate(414 110)"><rect width="342" height="208" rx="22" fill="#FFF"/><text x="20" y="34" font-size="16" font-weight="700" fill="#195BB8">交易中 P013 / P014 / P015</text><text x="20" y="68">P013：取消；支付未知；支付失败；已确认</text><text x="20" y="94">P014：处理中；长期处理中；成功；最终失败；查询失败</text><text x="20" y="120">P015：充值未知；退款处理中；已退款；充值最终失败</text><text x="20" y="146">未知态只查原交易；禁止重复扣款、重充或自动退款</text><rect x="20" y="166" width="110" height="26" rx="13" fill="#EAF2FF"/><text x="75" y="184" text-anchor="middle" fill="#195BB8">仅显示允许动作</text></g>
    <g transform="translate(788 110)"><rect width="342" height="208" rx="22" fill="#FFF"/><text x="20" y="34" font-size="16" font-weight="700" fill="#195BB8">身份与订单 P020–P024</text><text x="20" y="68">P020：首次空；筛选空；加载；失败；未登录</text><text x="20" y="94">P021：退款不适用/尚无退款；失败；无权限</text><text x="20" y="120">P022：code失效需重取；资料拒绝不影响交易；登录失败</text><text x="20" y="146">P023：成功；失败；需补资料；未登录；P024资料未授权</text><rect x="20" y="166" width="102" height="26" rx="13" fill="#FDEEEE"/><text x="71" y="184" text-anchor="middle" fill="#B64848">越权统一拒绝</text></g>
    <g transform="translate(40 348)"><rect width="342" height="208" rx="22" fill="#FFF"/><text x="20" y="34" font-size="16" font-weight="700" fill="#195BB8">黄页 P040 / P041</text><text x="20" y="68">P040：城市无机构；筛选无结果；加载失败</text><text x="20" y="94">P041：内容不可用；报错成功；可重试失败；限频</text><text x="20" y="120">电话拨打前必须二次确认；报错不自动修改正文</text><text x="20" y="146">无权限/限频只保留“返回”，不暴露内部原因</text><rect x="20" y="166" width="116" height="26" rx="13" fill="#EAF6F2"/><text x="78" y="184" text-anchor="middle" fill="#19865D">请求号用于客服</text></g>
    <g transform="translate(414 348)"><rect width="342" height="208" rx="22" fill="#FFF"/><text x="20" y="34" font-size="16" font-weight="700" fill="#195BB8">资讯 P042 / P043</text><text x="20" y="68">P042：首次空；筛选空；加载失败；刷新失败</text><text x="20" y="94">P043：内容已下架；内容已过期；详情加载失败</text><text x="20" y="120">下架/过期不得继续显示已缓存正文</text><text x="20" y="146">不可恢复失败只保留返回；可恢复失败显示重新加载</text><rect x="20" y="166" width="106" height="26" rx="13" fill="#F3F5F8"/><text x="73" y="184" text-anchor="middle" fill="#596A82">空态不是错误</text></g>
    <g transform="translate(788 348)"><rect width="342" height="208" rx="22" fill="#FFF"/><text x="20" y="34" font-size="16" font-weight="700" fill="#195BB8">后台参照 A130</text><text x="20" y="68">无权限：隐藏启用动作，服务端再次拒绝</text><text x="20" y="94">必填成本/汇率/费用缺失：试算与启用均关闭</text><text x="20" y="120">试算失败：展示固定中文原因与requestId</text><text x="20" y="146">草稿可编辑不代表可启用；仅SUPER_ADMIN启用</text><rect x="20" y="166" width="118" height="26" rx="13" fill="#FFF3D8"/><text x="79" y="184" text-anchor="middle" fill="#9B6815">失败关闭不猜值</text></g>
  </g>
  <rect x="40" y="590" width="1090" height="194" rx="22" fill="#195BB8"/><text x="64" y="626" font-size="17" font-weight="700" fill="#FFF">统一组件行为</text><text x="64" y="658" font-size="13" fill="#DCEAFF">加载：原位骨架，不闪现旧数据　｜　首次空：解释用途 + 单一主动作　｜　筛选空：保留筛选条件 + 清除筛选</text><text x="64" y="688" font-size="13" fill="#DCEAFF">可恢复失败：中文原因 + 重新加载　｜　不可恢复失败：中文原因 + 返回/客服　｜　未知：仅查询权威原交易</text><text x="64" y="718" font-size="13" fill="#DCEAFF">无权限/未登录：不展示受保护事实；仅显示登录或返回　｜　所有错误：不显示原异常、供应商枚举或Secret</text><text x="64" y="756" font-size="11" fill="#BFD5F5">视觉固定：#195BB8 / #F4F7FB / 白卡 / 18–22px圆角 / 主按钮文字居中；本板仅为实现状态标注，不新增产品页面。</text></g>
</svg>
