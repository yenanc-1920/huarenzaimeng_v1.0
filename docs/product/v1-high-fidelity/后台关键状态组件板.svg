<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"><rect width="1200" height="820" rx="18" fill="#F3F6FA"/><g font-family="Arial,'Microsoft YaHei'"><text x="44" y="54" font-size="24" font-weight="700" fill="#142540">后台关键状态组件板</text><text x="44" y="80" font-size="12" fill="#7A8799">适用于全部后台屏幕，不新增业务页面，不改变字段与权限模型</text><rect x="44" y="112" width="540" height="240" rx="22" fill="#FFF"/><rect x="66" y="134" width="136" height="32" rx="16" fill="#EAF2FF"/><text x="134" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#195BB8">正常 / 加载</text><text x="68" y="204" font-size="13" fill="#263852">正常：显示服务端事实与更新时间</text><text x="68" y="242" font-size="13" fill="#263852">加载：表格骨架；按钮禁用</text><text x="68" y="280" font-size="13" fill="#263852">长任务：显示进度与请求号</text><rect x="68" y="302" width="160" height="34" rx="11" fill="#EAF2FF"/><text x="148" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#195BB8">样例操作</text><rect x="612" y="112" width="540" height="240" rx="22" fill="#FFF"/><rect x="634" y="134" width="136" height="32" rx="16" fill="#F3F5F8"/><text x="702" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#596A82">空态</text><text x="636" y="204" font-size="13" fill="#263852">首次空：解释用途 + 新建入口</text><text x="636" y="242" font-size="13" fill="#263852">筛选空：保留筛选 + 清除条件</text><text x="636" y="280" font-size="13" fill="#263852">只读空：明确“不适用/尚无”</text><rect x="636" y="302" width="160" height="34" rx="11" fill="#F3F5F8"/><text x="716" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#596A82">样例操作</text><rect x="44" y="392" width="540" height="240" rx="22" fill="#FFF"/><rect x="66" y="414" width="136" height="32" rx="16" fill="#FDEEEE"/><text x="134" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#B64848">失败</text><text x="68" y="484" font-size="13" fill="#263852">可恢复：中文原因 + 重新加载</text><text x="68" y="522" font-size="13" fill="#263852">不可恢复：中文原因 + 返回</text><text x="68" y="560" font-size="13" fill="#263852">不展示原异常、Secret或内部枚举</text><rect x="68" y="582" width="160" height="34" rx="11" fill="#FDEEEE"/><text x="148" y="604" text-anchor="middle" font-size="12" font-weight="700" fill="#B64848">样例操作</text><rect x="612" y="392" width="540" height="240" rx="22" fill="#FFF"/><rect x="634" y="414" width="136" height="32" rx="16" fill="#FFF3D8"/><text x="702" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#9B6815">禁用 / 无权限</text><text x="636" y="484" font-size="13" fill="#263852">依赖缺失：动作禁用并说明条件</text><text x="636" y="522" font-size="13" fill="#263852">无权限：隐藏动作，服务端再次拒绝</text><text x="636" y="560" font-size="13" fill="#263852">会话过期：回登录，不保留敏感输入</text><rect x="636" y="582" width="160" height="34" rx="11" fill="#FFF3D8"/><text x="716" y="604" text-anchor="middle" font-size="12" font-weight="700" fill="#9B6815">样例操作</text><rect x="44" y="692" width="1108" height="84" rx="18" fill="#10284D"/><text x="68" y="726" font-size="14" font-weight="700" fill="#FFF">权限提示</text><text x="68" y="754" font-size="12" fill="#CFE0FA">CONTENT_OPERATOR 不可自审；CONTENT_REVIEWER 不改正文；CUSTOMER_SERVICE 不改权威交易；启用商品/渠道/价格仅 SUPER_ADMIN。</text></g></svg>