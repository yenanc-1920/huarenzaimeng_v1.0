<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10284D"/><stop offset="1" stop-color="#0C1D38"/></linearGradient></defs><rect width="1200" height="820" rx="18" fill="#F3F6FA"/><rect width="228" height="820" fill="url(#nav)"/><g font-family="Arial,'Microsoft YaHei'"><text x="32" y="48" font-size="20" font-weight="700" fill="#FFF">华人在孟 · 运营台</text><rect x="16" y="66" width="196" height="40" rx="12" fill="#195BB8"/><text x="40" y="94" font-size="14" fill="#FFF">工作台</text><text x="40" y="146" font-size="14" fill="#B9C8DE">客服案件</text><text x="40" y="198" font-size="14" fill="#B9C8DE">交易差异</text><text x="40" y="250" font-size="14" fill="#B9C8DE">内容审核</text><text x="40" y="302" font-size="14" fill="#B9C8DE">黄页管理</text><text x="40" y="354" font-size="14" fill="#B9C8DE">节假日与资讯</text><text x="40" y="406" font-size="14" fill="#B9C8DE">商品运营</text><text x="40" y="458" font-size="14" fill="#B9C8DE">订单运营</text><circle cx="48" cy="776" r="18" fill="#244064"/><text x="48" y="781" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">南</text><text x="76" y="774" font-size="12" fill="#FFF">超级管理员</text><text x="76" y="792" font-size="10" fill="#9FB2CB">唯一受控账号</text><rect x="228" width="972" height="74" fill="#FFF"/><text x="262" y="37" font-size="21" font-weight="700" fill="#142540">运营工作台</text><text x="262" y="58" font-size="11" fill="#7A8799">关键待办、依赖异常和业务概览</text><rect x="252" y="98" width="924" height="112" rx="18" fill="#FFF"/><text x="276" y="132" font-size="16" font-weight="700" fill="#142540">当前权限范围</text><text x="276" y="164" font-size="13" fill="#263852">唯一超级管理员：可提交、审核、发布；每一步记录操作人、版本与时间</text><text x="276" y="188" font-size="12" fill="#7A8799">其他角色仍保持职责分离；任何角色都不能改写支付、充值或退款权威事实</text><rect x="252" y="230" width="286" height="126" rx="18" fill="#FFF"/><text x="276" y="266" font-size="12" fill="#7A8799">待处理客服案件</text><text x="276" y="318" font-size="3