<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#17345F" flood-opacity=".10"/></filter></defs><rect width="390" height="844" rx="32" fill="#F4F7FB"/><rect width="390" height="94" rx="32" fill="#FFF"/><rect y="62" width="390" height="32" fill="#FFF"/><text x="24" y="61" font-size="23" fill="#1B2B45">‹</text><text x="58" y="58" font-family="Arial,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#142540">微信登录</text><circle cx="195" cy="162" r="48" fill="#EAF6F2"/><circle cx="195" cy="162" r="34" fill="#24A269"/><text x="195" y="172" text-anchor="middle" font-size="27" fill="#FFF">✓</text><text x="195" y="239" text-anchor="middle" font-family="Arial,'Microsoft YaHei'" font-size="25" font-weight="700" fill="#10213D">微信快捷登录</text><text x="195" y="269" text-anchor="middle" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#75839A">登录后安全查看自己的订单</text><rect x="20" y="304" width="350" height="230" rx="22" fill="#FFF" filter="url(#s)"/><text x="40" y="340" font-family="Arial,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#142540">登录与授权说明</text><circle cx="49" cy="378" r="6" fill="#195BB8"/><text x="68" y="383" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#31435E">建立平台买家会话，仅允许访问本人订单</text><circle cx="49" cy="420" r="6" fill="#195BB8"/><text x="68" y="425" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#31435E">头像昵称授权与登录身份分离</text><circle cx="49" cy="462" r="6" fill="#195BB8"/><text x="68" y="467" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#31435E">两项协议同意后再进入微信官方隐私授权</text><text x="40" y="503" font-family="Arial,'Microsoft YaHei'" font-size="11" fill="#7A8799">拒绝头像昵称授权不影响登录和下单</text><rect x="20" y="556" width="350" height="112" rx="20" fill="#FFF"/><rect x="40" y="578" width="20" height="20" rx="5" fill="#FFF" stroke="#AEBACB" stroke-width="2"/><text x="72" y="593" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#31435E">我已阅读并同意</text><text x="169" y="593" font-family="Arial,'Microsoft YaHei'" font-size="13" font-weight="700" fill="#195BB8">《用户协议》</text><rect x="40" y="620" width="20" height="20" rx="5" fill="#FFF" stroke="#AEBACB" stroke-width="2"/><text x="72" y="635" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#31435E">我已阅读并同意</text><text x="169" y="635" font-family="Arial,'Microsoft YaHei'" font-size="13" font-weight="700" fill="#195BB8">《隐私政策》</text><rect x="20" y="690" width="350" height="58" rx="18" fill="#CAD3DF"/><text x="195" y="726" text-anchor="middle" font-family="Arial,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#FFF">请先同意两项协议</text><text x="195" y="780" text-anchor="middle" font-family="Arial,'Microsoft YaHei'" font-size="11" fill="#8793A4">两项默认未勾选；拒绝时不会创建登录会话</text></svg>
