<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#17345F" flood-opacity=".09"/></filter></defs><rect width="390" height="844" rx="32" fill="#F4F7FB"/><rect width="390" height="94" rx="32" fill="#FFF"/><rect y="62" width="390" height="32" fill="#FFF"/><text x="24" y="61" font-size="23" fill="#1B2B45">‹</text><text x="58" y="58" font-family="Arial,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#142540">找回历史订单</text><text x="24" y="134" font-family="Arial,'Microsoft YaHei'" font-size="27" font-weight="700" fill="#10213D">找回没有显示的订单</text><text x="24" y="166" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#75839A">正常重新登录会自动恢复；缺失时再申请</text>
