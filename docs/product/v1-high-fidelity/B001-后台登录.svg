<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10284D"/><stop offset="1" stop-color="#195BB8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0B1D38" flood-opacity=".22"/></filter></defs><rect width="1200" height="820" rx="18" fill="url(#bg)"/><g font-family="Arial,'Microsoft YaHei'"><text x="88" y="120" font-size="28" font-weight="700" fill="#FFF">华人在孟 · 运营台</text><text x="88" y="156" font-size="14" fill="#CFE0FA">仅授权人员访问 · 权限由服务端校验</text><rect x="656" y="112" width="420" height="596" rx="28" fill="#FFF" filter="url(#s)"/><text x="704" y="184" font-size="24" font-weight="700" fill="#142540">管理员登录</text><text x="704" y="214" font-size="12" fill="#7A8799">登录后按角色显示菜单和可执行动作</text><text x="704" y="278" font-size="12" fill="#68768C">账号</text><rect x="704" y="294" width="324" height="48" rx="12" fill="#F7F9FC" stroke="#DDE4EE"/><text x="722" y="324" font-size="13" fill="#7A8799">请输入管理员账号</text><text x="704" y="382" font-size="12" fill="#68768C">密码</text><rect x="704" y="398" width="324" height="48" rx="12" fill="#F7F9FC" stroke="#DDE4EE"/><text x="722" y="428" font-size="15" fill="#7A8799">请输入密码</text><rect x="704" y="486" width="324" height="52" rx="14" fill="#195BB8"/><text x="866" y="519" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">登录</text><text x="866" y="574" text-anchor="middle" font-size="11" fill="#8793A4">会话过期后需重新登录</text><rect x="88" y="574" width="468" height="132" rx="20" fill="#FFF" fill-opacity=".10"/><text x="112" y="610" font-size="14" font-weight="700" fill="#FFF">权限与审计</text><text x="112" y="640" font-size="12" fill="#DCEAFF">普通角色保持提交、审核、发布职责分离。</text><text x="112" y="668" font-size="12" fill="#DCEAFF">唯一超级管理员可同人完成三步，每一步独立留痕。</text></g></svg>
