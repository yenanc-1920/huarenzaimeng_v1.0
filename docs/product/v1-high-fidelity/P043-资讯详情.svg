<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#17345F" flood-opacity=".09"/></filter></defs><rect width="390" height="844" rx="32" fill="#F4F7FB"/><rect width="390" height="94" rx="32" fill="#FFF"/><rect y="62" width="390" height="32" fill="#FFF"/><text x="24" y="61" font-size="23" fill="#1B2B45">‹</text><text x="58" y="58" font-family="Arial,'Microsoft YaHei'" font-size="18" font-weight="700" fill="#142540">资讯详情</text><rect x="20" y="114" width="350" height="186" rx="24" fill="#195BB8" filter="url(#s)"/><rect x="40" y="138" width="86" height="28" rx="14" fill="#FFF" fill-opacity=".16"/><text x="83" y="157" text-anchor="middle" font-family="Arial,'Microsoft YaHei'" font-size="11" fill="#FFF">节假日说明</text><text x="40" y="206" font-family="Arial,'Microsoft YaHei'" font-size="25" font-weight="700" fill="#FFF">孟加拉公共假期提醒</text><text x="40" y="240" font-family="Arial,'Microsoft YaHei'" font-size="13" fill="#DCEAFF">提前关注公共服务时间与交通变化</text><text x="40" y="275" font-family="Arial" font-size="11" fill="#CFE0FA">更新于 2026-08-15</text>
